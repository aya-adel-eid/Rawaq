<div class="h-screen flex flex-col items-center justify-center gap-4 text-center" role="alert">
  <span class="size-25 rounded-full bg-[#FFDAD6] flex justify-center items-center">
    <svg width="59" height="51" viewBox="0 0 59 51" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M0 50.6667L29.3333 0L58.6667 50.6667H0ZM9.2 45.3333H49.4667L29.3333 10.6667L9.2 45.3333ZM29.3333 42.6667C30.0889 42.6667 30.7222 42.4111 31.2333 41.9C31.7444 41.3889 32 40.7556 32 40C32 39.2444 31.7444 38.6111 31.2333 38.1C30.7222 37.5889 30.0889 37.3333 29.3333 37.3333C28.5778 37.3333 27.9444 37.5889 27.4333 38.1C26.9222 38.6111 26.6667 39.2444 26.6667 40C26.6667 40.7556 26.9222 41.3889 27.4333 41.9C27.9444 42.4111 28.5778 42.6667 29.3333 42.6667ZM26.6667 34.6667H32V21.3333H26.6667V34.6667Z"
        fill="#BA1A1A"
      />
    </svg>
  </span>
  <h3 class="text-[1.25rem] lg:text-[2rem] leading-7.5 text-error font-bold">{{ title() }}</h3>
  <p class="text-[0.875rem] lg:text-[1.5rem] leading-5 text-[#3E494A] py-4">{{ message() }}</p>
  <button
    type="button"
    (click)="retry.emit()"
    class="bg-primary cursor-pointer rounded-[12px] px-10 py-4 text-[1rem] font-medium text-white"
  >
    Try again
  </button>
</div>
