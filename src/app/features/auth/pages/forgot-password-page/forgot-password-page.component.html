<!-- header -->
<div class="bg-Surface shadow-[0px_4px_16px_0px_rgba(0,0,0,0.12)] py-4 px-10 flex justify-between">
  <h3 class="text-[1.5rem] leading-9 lg:leading-8 tracking-normal text-primary font-bold">Rawaq</h3>
  <a class="text-[0.875rem] leading-5 tracking-[0.14px] text-[#3E494A] flex items-center">
    <span
      ><svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M3.825 9L9.425 14.6L8 16L0 8L8 0L9.425 1.4L3.825 7H16V9H3.825Z" fill="#3E494A" />
      </svg>
    </span>
    <span>Back to Login</span></a
  >
</div>
<div class="flex items-center justify-center min-h-screen">
  <div
    class="w-full lg:max-w-5xl lg:grid grid-cols-2 gap-12 justify-center items-center px-5 pb-[61.62px] lg:p-0 pt-[109.63px]"
  >
    <!-- content page -->

    <!-- left -->
    <div class="lg:flex flex-col gap-8 hidden">
      <!-- image -->
      <div class="pb-1.5 backdrop-blur-[40]">
        <img
          src="/images/Academic Focus.png"
          alt=" academic rawaq"
          class="max-w-91.5 rounded-2xl"
        />
      </div>
      <div class="flex flex-col gap-4">
        <h4 class="text-[1.5rem] font-semibold leading-8 tracking-normal text-primary">
          Restore Your Path
        </h4>
        <p class="max-w-[367.5px] text-[1rem] tracking-normal leading-6 text-[#3E494A]">
          Losing access shouldn't stop your journey. Enter your details and we'll help you get back
          to your structured learning space.
        </p>
      </div>
    </div>
    <!-- right -->
    <!-- form -->
    <div
      class="bg-white rounded-3xl border border-[#D8E3FA] p-8 lg:p-12 shadow-[0px_16px_48px_0px_rgba(0,0,0,0.08)] backdrop-blur-[12px] flex flex-col gap-8"
    >
      <!-- image -->
      <div class="lg:hidden flex justify-center">
        <img src="/images/Academic Focus.png" alt="Rawaq" class="rounded-2xl max-w-7l" />
      </div>
      <!-- header -->
      <div class="flex flex-col gap-2 items-center lg:items-start">
        <span class="size-16 flex justify-center items-center bg-[#006D771A] rounded-xl">
          <svg
            width="27"
            height="27"
            viewBox="0 0 27 27"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path

            />
          </svg>
        </span>
        <h3 class="font-semibold text-[2rem] leading-10 tracking-[-0.32px] text-[#111C2C] pt-4">
          Forgot Password?
        </h3>
        <p class="text-[1rem] leading-6 tracking-normal text-[#3E494A]">
          Enter your email to receive a reset link.
        </p>
      </div>
      <form action="" class="flex flex-col gap-8">
        <!-- email -->
        <div class="flex flex-col gap-[8.5px]">
          <label for="input-group-1" class="label-input">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3 pointer-events-none">
              <svg
                width="17"
                height="14"
                viewBox="0 0 17 14"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M1.66667 13.3333C1.20833 13.3333 0.815972 13.1701 0.489583 12.8438C0.163194 12.5174 0 12.125 0 11.6667V1.66667C0 1.20833 0.163194 0.815972 0.489583 0.489583C0.815972 0.163194 1.20833 0 1.66667 0H15C15.4583 0 15.8507 0.163194 16.1771 0.489583C16.5035 0.815972 16.6667 1.20833 16.6667 1.66667V11.6667C16.6667 12.125 16.5035 12.5174 16.1771 12.8438C15.8507 13.1701 15.4583 13.3333 15 13.3333H1.66667ZM8.33333 7.5L1.66667 3.33333V11.6667H15V3.33333L8.33333 7.5ZM8.33333 5.83333L15 1.66667H1.66667L8.33333 5.83333ZM1.66667 3.33333V1.66667V3.33333V11.6667V3.33333Z"
                  fill="#6F797A"
                />
              </svg>
            </div>
            <input
              type="text"
              id="input-group-1"
              class="block w-full py-3.5 ps-11 bg-white border border-[#BEC8CA] rounded-lg text-[#6B7280] text-[1rem] leading-[100%] tracking-normal"
              placeholder="name@example.com"
            />
          </div>
        </div>
        <!-- button -->
        <app-button [variant]="'Primary'" [type]="'submit'">
          <span class="flex justify-center items-center gap-2">
            <span
              class="text-[1rem] tracking-normal leading-6 lg:text-[0.75rem] lg:leading-5 lg:tracking-[0.14px]"
            >
              Send Reset Link
            </span>

            <svg
              width="19"
              height="16"
              viewBox="0 0 19 16"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M0 16V0L19 8L0 16ZM2 13L13.85 8L2 3V6.5L8 8L2 9.5V13ZM2 13V8V3V6.5V9.5V13Z"
                fill="white"
              />
            </svg>
          </span>
        </app-button>
      </form>
    </div>
  </div>
</div>
