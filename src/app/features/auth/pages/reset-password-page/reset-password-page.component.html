<!-- header -->
<div class="bg-Surface shadow-[0px_4px_16px_0px_rgba(0,0,0,0.12)] py-4 px-10 flex justify-between">
  <h3 class="text-[1.5rem] leading-9 lg:leading-8 tracking-normal text-primary font-bold">Rawaq</h3>
  <a
    class="text-[0.875rem] leading-5 tracking-[0.14px] text-[#3E494A] flex items-center gap-1"
    routerLink="/sign-in"
  >
    <span
      ><svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M3.825 9L9.425 14.6L8 16L0 8L8 0L9.425 1.4L3.825 7H16V9H3.825Z" fill="#3E494A" />
      </svg>
    </span>
    <span>Back to Login</span></a
  >
</div>
<div class="min-h-screen flex justify-center items-center p-4 bg-Surface">
  <!-- form -->
  <div
    class="w-full lg:max-w-120 rounded-xl border border-[#D8E3FA4D] shadow p-6 lg:p-12 bg-white flex flex-col gap-8"
  >
    <!-- header -->
    <div class="flex flex-col gap-2 items-center">
      <!-- icon -->
      <div class="size-16 bg-[#006D771A] rounded-full flex justify-center items-center py-4">
        <svg
          width="27"
          height="27"
          viewBox="0 0 27 27"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M13.3333 26.6667C11.4889 26.6667 9.75556 26.3167 8.13333 25.6167C6.51111 24.9167 5.1 23.9667 3.9 22.7667C2.7 21.5667 1.75 20.1556 1.05 18.5333C0.35 16.9111 0 15.1778 0 13.3333H2.66667C2.66667 14.8 2.94444 16.1833 3.5 17.4833C4.05556 18.7833 4.81667 19.9167 5.78333 20.8833C6.75 21.85 7.88333 22.6167 9.18333 23.1833C10.4833 23.75 11.8667 24.0333 13.3333 24.0333C16.3111 24.0333 18.8333 23 20.9 20.9333C22.9667 18.8667 24 16.3444 24 13.3667C24 10.3889 22.9667 7.86667 20.9 5.8C18.8333 3.73333 16.3111 2.7 13.3333 2.7C11.3556 2.7 9.56111 3.18333 7.95 4.15C6.33889 5.11667 5.06667 6.4 4.13333 8H8V10.6667H0V2.66667H2.66667V5.33333C3.88889 3.71111 5.42222 2.41667 7.26667 1.45C9.11111 0.483333 11.1333 0 13.3333 0C15.1778 0 16.9111 0.35 18.5333 1.05C20.1556 1.75 21.5667 2.7 22.7667 3.9C23.9667 5.1 24.9167 6.51111 25.6167 8.13333C26.3167 9.75556 26.6667 11.4889 26.6667 13.3333C26.6667 15.1778 26.3167 16.9111 25.6167 18.5333C24.9167 20.1556 23.9667 21.5667 22.7667 22.7667C21.5667 23.9667 20.1556 24.9167 18.5333 25.6167C16.9111 26.3167 15.1778 26.6667 13.3333 26.6667ZM10.6667 18.6667C10.2889 18.6667 9.97222 18.5389 9.71667 18.2833C9.46111 18.0278 9.33333 17.7111 9.33333 17.3333V13.3333C9.33333 12.9556 9.46111 12.6389 9.71667 12.3833C9.97222 12.1278 10.2889 12 10.6667 12V10.6667C10.6667 9.93333 10.9278 9.30556 11.45 8.78333C11.9722 8.26111 12.6 8 13.3333 8C14.0667 8 14.6944 8.26111 15.2167 8.78333C15.7389 9.30556 16 9.93333 16 10.6667V12C16.3778 12 16.6944 12.1278 16.95 12.3833C17.2056 12.6389 17.3333 12.9556 17.3333 13.3333V17.3333C17.3333 17.7111 17.2056 18.0278 16.95 18.2833C16.6944 18.5389 16.3778 18.6667 16 18.6667H10.6667ZM12 12H14.6667V10.6667C14.6667 10.2889 14.5389 9.97222 14.2833 9.71667C14.0278 9.46111 13.7111 9.33333 13.3333 9.33333C12.9556 9.33333 12.6389 9.46111 12.3833 9.71667C12.1278 9.97222 12 10.2889 12 10.6667V12Z"
            fill="#00535B"
          />
        </svg>
      </div>
      <h2 class="pt-4 text-[#111C2C] text-[1.5rem] leading-8 tracking-normal font-semibold">
        Reset Password
      </h2>
      <p class="max-w-[324.7px] text-center text-[1rem] leading-6 tracking-normal text-[#3E494A]">
        Secure your account by choosing a strong, memorable password.
      </p>
    </div>
    <!--form  -->
    <form action="" class="flex flex-col gap-6">
      <!-- pass -->
      <div class="flex flex-col gap-1.5">
        <label for="password" class="label-input">New password</label>

        <div class="relative">
          <input
            type="password"
            id="password"
            class="block w-full py-3.5 ps-3 bg-white lg:bg-Surface border border-[#BEC8CA] rounded-lg text-[#6B7280] text-[1rem] leading-[100%] tracking-normal"
            placeholder="••••••••"
          />
          <span class="absolute top-1/2 -translate-y-1/2 inset-e-4 cursor-pointer">
            <svg
              width="22"
              height="15"
              viewBox="0 0 22 15"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M11 12C12.25 12 13.3125 11.5625 14.1875 10.6875C15.0625 9.8125 15.5 8.75 15.5 7.5C15.5 6.25 15.0625 5.1875 14.1875 4.3125C13.3125 3.4375 12.25 3 11 3C9.75 3 8.6875 3.4375 7.8125 4.3125C6.9375 5.1875 6.5 6.25 6.5 7.5C6.5 8.75 6.9375 9.8125 7.8125 10.6875C8.6875 11.5625 9.75 12 11 12ZM11 10.2C10.25 10.2 9.6125 9.9375 9.0875 9.4125C8.5625 8.8875 8.3 8.25 8.3 7.5C8.3 6.75 8.5625 6.1125 9.0875 5.5875C9.6125 5.0625 10.25 4.8 11 4.8C11.75 4.8 12.3875 5.0625 12.9125 5.5875C13.4375 6.1125 13.7 6.75 13.7 7.5C13.7 8.25 13.4375 8.8875 12.9125 9.4125C12.3875 9.9375 11.75 10.2 11 10.2ZM11 15C8.56667 15 6.35 14.3208 4.35 12.9625C2.35 11.6042 0.9 9.78333 0 7.5C0.9 5.21667 2.35 3.39583 4.35 2.0375C6.35 0.679167 8.56667 0 11 0C13.4333 0 15.65 0.679167 17.65 2.0375C19.65 3.39583 21.1 5.21667 22 7.5C21.1 9.78333 19.65 11.6042 17.65 12.9625C15.65 14.3208 13.4333 15 11 15ZM11 13C12.8833 13 14.6125 12.5042 16.1875 11.5125C17.7625 10.5208 18.9667 9.18333 19.8 7.5C18.9667 5.81667 17.7625 4.47917 16.1875 3.4875C14.6125 2.49583 12.8833 2 11 2C9.11667 2 7.3875 2.49583 5.8125 3.4875C4.2375 4.47917 3.03333 5.81667 2.2 7.5C3.03333 9.18333 4.2375 10.5208 5.8125 11.5125C7.3875 12.5042 9.11667 13 11 13Z"
                fill="#6F797A"
              />
            </svg>
          </span>
        </div>
        <span class="text-[0.688rem] leading-[16.5px] tracking-normal text-[#6F797A]"
          >Must be at least 8 characters long.</span
        >
      </div>

      <!-- Confirm password -->
      <div class="flex flex-col gap-[8.5px]">
        <label for="password" class="label-input">Confirm password</label>

        <div class="relative">
          <div>
            <input
              type="password"
              id="confirmPassword"
              class="block w-full py-3.5 ps-3 bg-white lg:bg-Surface border border-[#BEC8CA] rounded-lg text-[#6B7280] text-[1rem] leading-[100%] tracking-normal"
              placeholder="••••••••"
            />
            <span class="absolute top-1/2 -translate-y-1/2 inset-e-4 cursor-pointer">
              <svg
                width="22"
                height="15"
                viewBox="0 0 22 15"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M11 12C12.25 12 13.3125 11.5625 14.1875 10.6875C15.0625 9.8125 15.5 8.75 15.5 7.5C15.5 6.25 15.0625 5.1875 14.1875 4.3125C13.3125 3.4375 12.25 3 11 3C9.75 3 8.6875 3.4375 7.8125 4.3125C6.9375 5.1875 6.5 6.25 6.5 7.5C6.5 8.75 6.9375 9.8125 7.8125 10.6875C8.6875 11.5625 9.75 12 11 12ZM11 10.2C10.25 10.2 9.6125 9.9375 9.0875 9.4125C8.5625 8.8875 8.3 8.25 8.3 7.5C8.3 6.75 8.5625 6.1125 9.0875 5.5875C9.6125 5.0625 10.25 4.8 11 4.8C11.75 4.8 12.3875 5.0625 12.9125 5.5875C13.4375 6.1125 13.7 6.75 13.7 7.5C13.7 8.25 13.4375 8.8875 12.9125 9.4125C12.3875 9.9375 11.75 10.2 11 10.2ZM11 15C8.56667 15 6.35 14.3208 4.35 12.9625C2.35 11.6042 0.9 9.78333 0 7.5C0.9 5.21667 2.35 3.39583 4.35 2.0375C6.35 0.679167 8.56667 0 11 0C13.4333 0 15.65 0.679167 17.65 2.0375C19.65 3.39583 21.1 5.21667 22 7.5C21.1 9.78333 19.65 11.6042 17.65 12.9625C15.65 14.3208 13.4333 15 11 15ZM11 13C12.8833 13 14.6125 12.5042 16.1875 11.5125C17.7625 10.5208 18.9667 9.18333 19.8 7.5C18.9667 5.81667 17.7625 4.47917 16.1875 3.4875C14.6125 2.49583 12.8833 2 11 2C9.11667 2 7.3875 2.49583 5.8125 3.4875C4.2375 4.47917 3.03333 5.81667 2.2 7.5C3.03333 9.18333 4.2375 10.5208 5.8125 11.5125C7.3875 12.5042 9.11667 13 11 13Z"
                  fill="#6F797A"
                />
              </svg>
            </span>
          </div>
        </div>
      </div>
      <!-- button -->
      <div>
        <app-button [variant]="'Primary'" [type]="'submit'">
          <span class="flex justify-center items-center gap-2">
            <span class="text-[1rem] tracking-normal leading-6 font-medium"> Reset Password </span>
            <span class="hidden lg:block">
              <svg
                width="14"
                height="14"
                viewBox="0 0 14 14"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M10.1458 7.5H0V5.83333H10.1458L5.47917 1.16667L6.66667 0L13.3333 6.66667L6.66667 13.3333L5.47917 12.1667L10.1458 7.5Z"
                  fill="white"
                />
              </svg>
            </span>
            <span class="lg:hidden">
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M12.175 9H0V7H12.175L6.575 1.4L8 0L16 8L8 16L6.575 14.6L12.175 9Z"
                  fill="white"
                />
              </svg>
            </span>
          </span>
        </app-button>
      </div>
    </form>
  </div>
</div>
