<div class="bg-Surface lg:bg-white lg:p-16 flex flex-col gap-6 px-5">
  <!-- header Desktop -->
  <div class="lg:flex flex-col gap-2 pb-10 hidden">
    <h3 class="text-[2rem] font-semibold leading-10 tracking-[-0.32px] text-primary">
      Welcome back
    </h3>
    <p class="text-[1rem] leading-6 tracking-normal">Log in to continue your education.</p>
  </div>
  <!-- header mobil -->
  <div class="flex flex-col justify-center items-center lg:hidden py-6 pt-8">
    <!-- icon -->
    <div class="bg-primary size-16 -rotate-3 flex justify-center items-center rounded-xl">
      <svg
        width="34"
        height="29"
        viewBox="0 0 34 29"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M16.335 28.6604C15.1864 27.6489 13.9267 26.8444 12.5561 26.2468C11.1855 25.6493 9.75125 25.3112 8.25331 25.2327C7.20474 25.1778 6.16771 25.2611 5.1422 25.4827C4.1167 25.7044 3.129 26.0406 2.1791 26.4916C1.64042 26.7387 1.13552 26.6997 0.664389 26.3746C0.193258 26.0495 -0.0272611 25.5999 0.00283212 25.0256L0.948805 6.97541C0.963198 6.70078 1.04559 6.44224 1.19599 6.19978C1.34638 5.95732 1.56216 5.78087 1.84333 5.67043C3.02315 5.13144 4.24506 4.74486 5.50905 4.51069C6.77304 4.27652 8.05414 4.19346 9.35236 4.26149C10.8004 4.33738 12.2074 4.59888 13.5733 5.04598C14.9393 5.49308 16.2393 6.12448 17.4733 6.94018L16.5234 25.0653C17.8385 24.3331 19.2056 23.804 20.6246 23.4778C22.0436 23.1516 23.4647 23.0258 24.8877 23.1004C25.7865 23.1475 26.6626 23.2685 27.5161 23.4634C28.3695 23.6584 29.2253 23.9285 30.0834 24.2739L31.0255 6.29857C31.3934 6.44302 31.7548 6.59339 32.1096 6.74968C32.4644 6.90596 32.8113 7.09312 33.1504 7.31117C33.4185 7.45039 33.6146 7.64843 33.7388 7.90528C33.8631 8.16213 33.918 8.42787 33.9036 8.70249L32.9576 26.7527C32.9275 27.3269 32.6612 27.7511 32.1587 28.0252C31.6561 28.2992 31.1499 28.2852 30.6401 27.9831C29.7425 27.4354 28.7953 26.9977 27.7986 26.6701C26.8019 26.3425 25.7793 26.1512 24.7307 26.0963C23.2328 26.0178 21.771 26.204 20.3454 26.655C18.9199 27.106 17.5831 27.7745 16.335 28.6604ZM19.7234 21.3277L20.4692 7.09719L28.3514 -1.394e-05L27.5664 14.9794L19.7234 21.3277ZM13.6041 23.4478L14.3812 8.61816C13.5757 8.22546 12.7347 7.91227 11.8582 7.67857C10.9817 7.44488 10.0941 7.30449 9.19535 7.25738C8.27162 7.20897 7.36827 7.24925 6.48531 7.37822C5.60235 7.50718 4.73978 7.72484 3.89759 8.03118L3.11844 22.8983C4.00925 22.6195 4.88924 22.4278 5.75841 22.3232C6.62758 22.2185 7.51155 22.1897 8.41031 22.2368C9.30908 22.2839 10.1852 22.405 11.0387 22.5999C11.8921 22.7948 12.7473 23.0775 13.6041 23.4478ZM13.6041 23.4478L14.3812 8.61816L13.6041 23.4478Z"
          fill="white"
        />
      </svg>
    </div>
    <h3 class="text-[1.75rem] leading-9 tracking-[-0.7px] text-primary pt-4">Rawaq</h3>
    <p class="text-[1rem] tracking-normal leading-6 text-[#3E494A] text-center max-w-87.5 pt-4">
      Your structured learning space for deep knowledge and focus.
    </p>
  </div>
  <!-- form -->
  <div>
    <form action="" class="flex flex-col gap-6 justify-between">
      <div class="flex flex-col gap-6">
        <!-- email -->
        <div class="flex flex-col gap-[8.5px]">
          <label for="input-group-1" class="label-input">Your Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3 pointer-events-none">
              <svg
                width="17"
                height="14"
                viewBox="0 0 17 14"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M1.66667 13.3333C1.20833 13.3333 0.815972 13.1701 0.489583 12.8438C0.163194 12.5174 0 12.125 0 11.6667V1.66667C0 1.20833 0.163194 0.815972 0.489583 0.489583C0.815972 0.163194 1.20833 0 1.66667 0H15C15.4583 0 15.8507 0.163194 16.1771 0.489583C16.5035 0.815972 16.6667 1.20833 16.6667 1.66667V11.6667C16.6667 12.125 16.5035 12.5174 16.1771 12.8438C15.8507 13.1701 15.4583 13.3333 15 13.3333H1.66667ZM8.33333 7.5L1.66667 3.33333V11.6667H15V3.33333L8.33333 7.5ZM8.33333 5.83333L15 1.66667H1.66667L8.33333 5.83333ZM1.66667 3.33333V1.66667V3.33333V11.6667V3.33333Z"
                  fill="#6F797A"
                />
              </svg>
            </div>
            <input
              type="text"
              id="input-group-1"
              class="block w-full py-3.5 ps-11 bg-white lg:bg-Surface border border-[#BEC8CA] rounded-lg text-[#6B7280] text-[1rem] leading-[100%] tracking-normal"
              placeholder="name@example.com"
            />
          </div>
        </div>
        <!-- pass -->
        <div class="flex flex-col gap-[8.5px]">
          <div class="flex justify-between items-center">
            <label for="password" class="label-input">Password</label>
            <span class="text-[0.75rem] leading-4 tracking-normal font-semibold text-primary"
              >Forgot password?</span
            >
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3 pointer-events-none">
              <svg
                width="14"
                height="18"
                viewBox="0 0 14 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M1.66667 17.5C1.20833 17.5 0.815972 17.3368 0.489583 17.0104C0.163194 16.684 0 16.2917 0 15.8333V7.5C0 7.04167 0.163194 6.64931 0.489583 6.32292C0.815972 5.99653 1.20833 5.83333 1.66667 5.83333H2.5V4.16667C2.5 3.01389 2.90625 2.03125 3.71875 1.21875C4.53125 0.40625 5.51389 0 6.66667 0C7.81944 0 8.80208 0.40625 9.61458 1.21875C10.4271 2.03125 10.8333 3.01389 10.8333 4.16667V5.83333H11.6667C12.125 5.83333 12.5174 5.99653 12.8438 6.32292C13.1701 6.64931 13.3333 7.04167 13.3333 7.5V15.8333C13.3333 16.2917 13.1701 16.684 12.8438 17.0104C12.5174 17.3368 12.125 17.5 11.6667 17.5H1.66667ZM1.66667 15.8333H11.6667V7.5H1.66667V15.8333ZM6.66667 13.3333C7.125 13.3333 7.51736 13.1701 7.84375 12.8438C8.17014 12.5174 8.33333 12.125 8.33333 11.6667C8.33333 11.2083 8.17014 10.816 7.84375 10.4896C7.51736 10.1632 7.125 10 6.66667 10C6.20833 10 5.81597 10.1632 5.48958 10.4896C5.16319 10.816 5 11.2083 5 11.6667C5 12.125 5.16319 12.5174 5.48958 12.8438C5.81597 13.1701 6.20833 13.3333 6.66667 13.3333ZM4.16667 5.83333H9.16667V4.16667C9.16667 3.47222 8.92361 2.88194 8.4375 2.39583C7.95139 1.90972 7.36111 1.66667 6.66667 1.66667C5.97222 1.66667 5.38194 1.90972 4.89583 2.39583C4.40972 2.88194 4.16667 3.47222 4.16667 4.16667V5.83333ZM1.66667 15.8333V7.5V15.8333Z"
                  fill="#6F797A"
                />
              </svg>
            </div>
            <div>
              <input
                type="text"
                id="password"
                class="block w-full py-3.5 ps-11 bg-white lg:bg-Surface border border-[#BEC8CA] rounded-lg text-[#6B7280] text-[1rem] leading-[100%] tracking-normal"
                placeholder="••••••••"
              />
              <span class="absolute top-1/2 -translate-y-1/2 inset-e-4 cursor-pointer">
                <svg
                  width="22"
                  height="15"
                  viewBox="0 0 22 15"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M11 12C12.25 12 13.3125 11.5625 14.1875 10.6875C15.0625 9.8125 15.5 8.75 15.5 7.5C15.5 6.25 15.0625 5.1875 14.1875 4.3125C13.3125 3.4375 12.25 3 11 3C9.75 3 8.6875 3.4375 7.8125 4.3125C6.9375 5.1875 6.5 6.25 6.5 7.5C6.5 8.75 6.9375 9.8125 7.8125 10.6875C8.6875 11.5625 9.75 12 11 12ZM11 10.2C10.25 10.2 9.6125 9.9375 9.0875 9.4125C8.5625 8.8875 8.3 8.25 8.3 7.5C8.3 6.75 8.5625 6.1125 9.0875 5.5875C9.6125 5.0625 10.25 4.8 11 4.8C11.75 4.8 12.3875 5.0625 12.9125 5.5875C13.4375 6.1125 13.7 6.75 13.7 7.5C13.7 8.25 13.4375 8.8875 12.9125 9.4125C12.3875 9.9375 11.75 10.2 11 10.2ZM11 15C8.56667 15 6.35 14.3208 4.35 12.9625C2.35 11.6042 0.9 9.78333 0 7.5C0.9 5.21667 2.35 3.39583 4.35 2.0375C6.35 0.679167 8.56667 0 11 0C13.4333 0 15.65 0.679167 17.65 2.0375C19.65 3.39583 21.1 5.21667 22 7.5C21.1 9.78333 19.65 11.6042 17.65 12.9625C15.65 14.3208 13.4333 15 11 15ZM11 13C12.8833 13 14.6125 12.5042 16.1875 11.5125C17.7625 10.5208 18.9667 9.18333 19.8 7.5C18.9667 5.81667 17.7625 4.47917 16.1875 3.4875C14.6125 2.49583 12.8833 2 11 2C9.11667 2 7.3875 2.49583 5.8125 3.4875C4.2375 4.47917 3.03333 5.81667 2.2 7.5C3.03333 9.18333 4.2375 10.5208 5.8125 11.5125C7.3875 12.5042 9.11667 13 11 13Z"
                    fill="#6F797A"
                  />
                </svg>
              </span>
            </div>
          </div>
        </div>
        <!-- remember -->
        <div class="flex items-center gap-2 py-2">
          <input
            id="link-checkbox"
            type="checkbox"
            value=""
            class="w-4 h-4 border border-[#BEC8CA] rounded-xs"
          />
          <label
            for="link-checkbox"
            class="text-[0.875rem] tracking-[0.14px] leading-5 text-[#3E494A] font-medium"
            >Remember me.</label
          >
        </div>
      </div>
      <div class="flex flex-col gap-6 py-8 lg:py-0">
        <app-button [variant]="'Primary'" [type]="'submit'">
          <span class="flex justify-center items-center gap-2">
            <span
              class="text-[1.5rem] tracking-normal leading-8 lg:text-[0.875rem] lg:tracking-[0.14px] lg:leading-5 font-medium"
            >
              Create Account
            </span>
            <span class="hidden lg:block">
              <svg
                width="12"
                height="12"
                viewBox="0 0 12 12"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M9.13125 6.75H0V5.25H9.13125L4.93125 1.05L6 0L12 6L6 12L4.93125 10.95L9.13125 6.75Z"
                  fill="white"
                />
              </svg>
            </span>
            <span class="lg:hidden">
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M12.175 9H0V7H12.175L6.575 1.4L8 0L16 8L8 16L6.575 14.6L12.175 9Z"
                  fill="white"
                />
              </svg>
            </span>
          </span>
        </app-button>
        <!-- footer -->
        <div class="pt-8 text-center lg:hidden">
          <p class="text-[1rem] leading-6 tracking-normal font-normal text-[#3E494A]">
            New to Rawaq? <a class="font-bold text-primary">Create Account</a>
          </p>
        </div>
      </div>
    </form>
  </div>
  <!-- footer -->
  <div class="pt-8 text-center hidden lg:block">
    <p class="text-[1rem] leading-6 tracking-normal font-normal text-[#3E494A]">
      New to Rawaq? <a class="font-bold text-primary">Create Account</a>
    </p>
  </div>
</div>
