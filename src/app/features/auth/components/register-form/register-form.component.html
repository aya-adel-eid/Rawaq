<div class="max-w-lg p-10 rounded-xl gap-3 bg-white shadow">
  <!-- header -->
  <div class="flex flex-col gap-1">
    <h2 class="text-[1.5rem] tracking-normal leading-8 text-[#111C2C] font-semibold">
      Create Account
    </h2>
    <p class="text-[1rem] font-medium text-[#3E494A] tracking-normal leading-6">
      Fill in the details below to get started.
    </p>
  </div>
  <!-- form -->
  <div>
    <form action="" class="flex flex-col gap-6">
      <div class="flex flex-col gap-3">
        <h3 class="text-[1rem] text-[#3E494A] tracking-normal leading-6 font-normal">I am a...:</h3>
        <ul class="flex select-none w-full gap-4">
          <li class="flex-1">
            <input
              type="radio"
              id="react-option"
              value="react-option"
              name="technologies"
              class="hidden peer"
              required=""
              checked
            />
            <label
              for="react-option"
              class="btn btn-outline w-full p-4 peer-checked:border-primary peer-checked:bg-Surface peer-checked:text-[#111C2C]"
            >
              <svg
                width="22"
                height="18"
                viewBox="0 0 22 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="mb-2"
              >
                <path
                  d="M11 18L4 14.2V8.2L0 6L11 0L22 6V14H20V7.1L18 8.2V14.2L11 18ZM11 9.7L17.85 6L11 2.3L4.15 6L11 9.7ZM11 15.725L16 13.025V9.25L11 12L6 9.25V13.025L11 15.725Z"
                  fill="#3E494A"
                />
              </svg>

              <div class="text-[0.75rem] tracking-normal leading-4 font-semibold text-[#111C2C]">
                Student
              </div>
            </label>
          </li>

          <li class="flex-1">
            <input
              type="radio"
              id="vue-option"
              value="vue-option"
              name="technologies"
              class="hidden peer"
              required=""
              checked
            />
            <label
              for="vue-option"
              class="btn btn-outline w-full p-4 peer-checked:border-primary peer-checked:bg-Surface peer-checked:text-[#111C2C]"
            >
              <svg
                width="22"
                height="23"
                viewBox="0 0 22 23"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M20 18V2H2V10H0V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H20C20.55 0 21.0208 0.195833 21.4125 0.5875C21.8042 0.979167 22 1.45 22 2V16C22 16.55 21.8042 17.0208 21.4125 17.4125C21.0208 17.8042 20.55 18 20 18ZM8 11C6.9 11 5.95833 10.6083 5.175 9.825C4.39167 9.04167 4 8.1 4 7C4 5.9 4.39167 4.95833 5.175 4.175C5.95833 3.39167 6.9 3 8 3C9.1 3 10.0417 3.39167 10.825 4.175C11.6083 4.95833 12 5.9 12 7C12 8.1 11.6083 9.04167 10.825 9.825C10.0417 10.6083 9.1 11 8 11ZM8 9C8.55 9 9.02083 8.80417 9.4125 8.4125C9.80417 8.02083 10 7.55 10 7C10 6.45 9.80417 5.97917 9.4125 5.5875C9.02083 5.19583 8.55 5 8 5C7.45 5 6.97917 5.19583 6.5875 5.5875C6.19583 5.97917 6 6.45 6 7C6 7.55 6.19583 8.02083 6.5875 8.4125C6.97917 8.80417 7.45 9 8 9ZM0 19V16.2C0 15.6333 0.145833 15.1125 0.4375 14.6375C0.729167 14.1625 1.11667 13.8 1.6 13.55C2.63333 13.0333 3.68333 12.6458 4.75 12.3875C5.81667 12.1292 6.9 12 8 12C9.1 12 10.1833 12.1292 11.25 12.3875C12.3167 12.6458 13.3667 13.0333 14.4 13.55C14.8833 13.8 15.2708 14.1625 15.5625 14.6375C15.8542 15.1125 16 15.6333 16 16.2V19H0ZM2 17H14V16.2C14 16.0167 13.9542 15.85 13.8625 15.7C13.7708 15.55 13.65 15.4333 13.5 15.35C12.6 14.9 11.6917 14.5625 10.775 14.3375C9.85833 14.1125 8.93333 14 8 14C7.06667 14 6.14167 14.1125 5.225 14.3375C4.30833 14.5625 3.4 14.9 2.5 15.35C2.35 15.4333 2.22917 15.55 2.1375 15.7C2.04583 15.85 2 16.0167 2 16.2V17Z"
                  fill="#3E494A"
                />
              </svg>

              <div class="text-[0.75rem] tracking-normal leading-4 font-semibold text-[#111C2C]">
                Teacher
              </div>
            </label>
          </li>
        </ul>
      </div>
      <!-- name -->
      <div class="flex gap-4 w-full">
        <app-reusable-input
          [label]="'First Name'"
          [placeholde]="'John'"
          [typeInput]="'text'"
          [idLabel]="'first-name'"
        ></app-reusable-input>
        <app-reusable-input
          [label]="'Last Name'"
          [placeholde]="'Doe'"
          [typeInput]="'text'"
          [idLabel]="'last-name'"
        ></app-reusable-input>
      </div>
      <!-- email -->

      <app-reusable-input
        [label]="'Email Address'"
        [placeholde]="'john.doe@example.com'"
        [typeInput]="'email'"
        [idLabel]="'email'"
      ></app-reusable-input>
      <!-- password -->
      <app-reusable-input
        [label]="'Password'"
        [placeholde]="'••••••••'"
        [typeInput]="'password'"
        [idLabel]="'password'"
      ></app-reusable-input>
      <!-- confirm password -->
      <app-reusable-input
        [label]="'Confirm Password'"
        [placeholde]="'••••••••'"
        [typeInput]="'password'"
        [idLabel]="'confirm-password'"
      ></app-reusable-input>
      <!-- avater -->
      <div>
        <label
          for="avater"
          class="bg-Surface border-2 border-dashed rounded-lg p-4 border-[#BEC8CA4D]/20 flex gap-2"
        >
          <input type="file" class="hidden" id="avater" />
          <div class="bg-[#BEC8CA33] rounded-full flex justify-center items-center size-12">
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M3.85 15.1C4.7 14.45 5.65 13.9375 6.7 13.5625C7.75 13.1875 8.85 13 10 13C11.15 13 12.25 13.1875 13.3 13.5625C14.35 13.9375 15.3 14.45 16.15 15.1C16.7333 14.4167 17.1875 13.6417 17.5125 12.775C17.8375 11.9083 18 10.9833 18 10C18 7.78333 17.2208 5.89583 15.6625 4.3375C14.1042 2.77917 12.2167 2 10 2C7.78333 2 5.89583 2.77917 4.3375 4.3375C2.77917 5.89583 2 7.78333 2 10C2 10.9833 2.1625 11.9083 2.4875 12.775C2.8125 13.6417 3.26667 14.4167 3.85 15.1ZM10 11C9.01667 11 8.1875 10.6625 7.5125 9.9875C6.8375 9.3125 6.5 8.48333 6.5 7.5C6.5 6.51667 6.8375 5.6875 7.5125 5.0125C8.1875 4.3375 9.01667 4 10 4C10.9833 4 11.8125 4.3375 12.4875 5.0125C13.1625 5.6875 13.5 6.51667 13.5 7.5C13.5 8.48333 13.1625 9.3125 12.4875 9.9875C11.8125 10.6625 10.9833 11 10 11ZM10 20C8.61667 20 7.31667 19.7375 6.1 19.2125C4.88333 18.6875 3.825 17.975 2.925 17.075C2.025 16.175 1.3125 15.1167 0.7875 13.9C0.2625 12.6833 0 11.3833 0 10C0 8.61667 0.2625 7.31667 0.7875 6.1C1.3125 4.88333 2.025 3.825 2.925 2.925C3.825 2.025 4.88333 1.3125 6.1 0.7875C7.31667 0.2625 8.61667 0 10 0C11.3833 0 12.6833 0.2625 13.9 0.7875C15.1167 1.3125 16.175 2.025 17.075 2.925C17.975 3.825 18.6875 4.88333 19.2125 6.1C19.7375 7.31667 20 8.61667 20 10C20 11.3833 19.7375 12.6833 19.2125 13.9C18.6875 15.1167 17.975 16.175 17.075 17.075C16.175 17.975 15.1167 18.6875 13.9 19.2125C12.6833 19.7375 11.3833 20 10 20ZM10 18C10.8833 18 11.7167 17.8708 12.5 17.6125C13.2833 17.3542 14 16.9833 14.65 16.5C14 16.0167 13.2833 15.6458 12.5 15.3875C11.7167 15.1292 10.8833 15 10 15C9.11667 15 8.28333 15.1292 7.5 15.3875C6.71667 15.6458 6 16.0167 5.35 16.5C6 16.9833 6.71667 17.3542 7.5 17.6125C8.28333 17.8708 9.11667 18 10 18ZM10 9C10.4333 9 10.7917 8.85833 11.075 8.575C11.3583 8.29167 11.5 7.93333 11.5 7.5C11.5 7.06667 11.3583 6.70833 11.075 6.425C10.7917 6.14167 10.4333 6 10 6C9.56667 6 9.20833 6.14167 8.925 6.425C8.64167 6.70833 8.5 7.06667 8.5 7.5C8.5 7.93333 8.64167 8.29167 8.925 8.575C9.20833 8.85833 9.56667 9 10 9Z"
                fill="#6F797A"
              />
            </svg>
          </div>
          <div class="flex flex-col">
            <span class="text-[1rem] leading-6 tracking-normal font-normal text-primary"
              >Upload Avatar (Optional)</span
            >
            <span class="text-[#3E494A] text-[0.75rem] leading-4 font-normal tracking-normal"
              >JPG, PNG or WEBP. Max 500KB.</span
            >
          </div>
        </label>
      </div>
      <!-- button -->
      <app-button [variant]="'Primary'" [type]="'submit'">
        <span class="flex justify-center items-center gap-2">
          <span> Create Account </span>

          <svg
            width="12"
            height="12"
            viewBox="0 0 12 12"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M9.13125 6.75H0V5.25H9.13125L4.93125 1.05L6 0L12 6L6 12L4.93125 10.95L9.13125 6.75Z"
              fill="white"
            />
          </svg>
        </span>
      </app-button>
    </form>
  </div>
</div>
