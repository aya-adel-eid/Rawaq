<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-[#111C2C]/40 p-4 backdrop-blur-xs"
>
  <div class="rounded-lg w-full bg-Surface max-w-2xl shadow-sm overflow-hidden">
    <!-- header -->
    <div
      class="py-6 px-8 bg-Surface border-b border-b-[#BEC8CA33] flex justify-between items-center"
    >
      <div class="flex gap-3 items-center">
        <span class="size-10 rounded-[12px] flex items-center justify-center bg-[#00535B1A]"
          ><svg
            width="20"
            height="21"
            viewBox="0 0 20 21"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M2 20.025C1.45 20.025 0.979167 19.8292 0.5875 19.4375C0.195833 19.0458 0 18.575 0 18.025V4.025C0 3.475 0.195833 3.00417 0.5875 2.6125C0.979167 2.22083 1.45 2.025 2 2.025H10.925L8.925 4.025H2V4.025V4.025V18.025V18.025V18.025H16V18.025V18.025V11.075L18 9.075V18.025C18 18.575 17.8042 19.0458 17.4125 19.4375C17.0208 19.8292 16.55 20.025 16 20.025H2V20.025M9 11.025V11.025V11.025V11.025V11.025V11.025V11.025V11.025V11.025V11.025V11.025V11.025V11.025V11.025V11.025V11.025M6 14.025V9.775L15.175 0.6C15.375 0.4 15.6 0.25 15.85 0.15C16.1 0.05 16.35 0 16.6 0C16.8667 0 17.1208 0.05 17.3625 0.15C17.6042 0.25 17.825 0.4 18.025 0.6L19.425 2.025C19.6083 2.225 19.75 2.44583 19.85 2.6875C19.95 2.92917 20 3.175 20 3.425C20 3.675 19.9542 3.92083 19.8625 4.1625C19.7708 4.40417 19.625 4.625 19.425 4.825L10.25 14.025H6V14.025M18.025 3.425V3.425L16.625 2.025V2.025L18.025 3.425V3.425M8 12.025H9.4L15.2 6.225L14.5 5.525L13.775 4.825L8 10.6V12.025V12.025M14.5 5.525L13.775 4.825V4.825L14.5 5.525L15.2 6.225V6.225L14.5 5.525V5.525"
              fill="#00535B"
            />
          </svg>
        </span>
        <h3 class="font-semibold text-[1.5rem] leading-8 tracking-normal text-primary">
          Create New Post
        </h3>
      </div>
      <span class="size-7.5 p-2">
        <svg
          width="14"
          height="14"
          viewBox="0 0 14 14"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M1.4 14L0 12.6L5.6 7L0 1.4L1.4 0L7 5.6L12.6 0L14 1.4L8.4 7L14 12.6L12.6 14L7 8.4L1.4 14V14"
            fill="#3E494A"
          />
        </svg>
      </span>
    </div>
    <!-- body -->
    <div class="p-8 flex flex-col gap-6">
      <!-- head -->
      <div class="flex gap-4 items-center">
        <img src="/images/person.png" alt="" class="size-12 rounded-full" />
        <div>
          <h4 class="text-[0.875rem] leading-5 tracking-[0.14px] font-medium text-[#111C2C]">
            Omar Al-Farsi
          </h4>
          <span class="text-[0.75rem] leading-4 tracking-normal text-[#3E494A]">
            <span class="font-normal">Posting to </span>
            <span class="font-semibold">Frontend Group </span>
          </span>
        </div>
      </div>
      <!-- text -->
      <div class="flex flex-col gap-2">
        <label for="" class="text-[0.875rem] leading-5 tracking-[0.14px] text-primary font-medium"
          >What's on your mind?</label
        >
        <textarea
          rows="6"
          name=""
          id=""
          placeholder="What's on your mind? Share an insight, ask a question, or post an update..."
          class="border-2 resize-none w-full rounded-[12px] focus:outline-0 focus:right-0 border-[#BEC8CA] px-4 pt-4 bg-[#F0F3FF] text-[1rem] leading-6 tracking-normal text-[#BEC8CA]"
        ></textarea>
      </div>
    </div>
    <!-- footer -->
    <div class="py-6 px-8 flex gap-4 justify-end border-t border-t-[#BEC8CA1A] bg-[#F0F3FF]">
      <button
        class="font-medium text-[0.875rem] leading-5 tracking-[0.14px] text-[#3E494A] py-2.5 px-6"
      >
        Cancel
      </button>
      <button
        class="font-medium text-[0.875rem] leading-5 tracking-[0.14px] text-white py-2.5 px-6 bg-primary rounded-[12px]"
      >
        Publish Post
      </button>
    </div>
  </div>
</div>
