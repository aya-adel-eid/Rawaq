<div
  class="flex animate-pulse flex-col gap-4 rounded-2xl border border-[#BEC8CA33]/30 bg-white p-5 shadow-sm lg:gap-0 lg:p-6"
  role="status"
  aria-label="Loading group"
>
  <!-- badges -->
  <div class="flex items-center justify-between lg:pb-4">
    <div class="h-[18px] w-20 rounded-full bg-gray-200"></div>
    <div class="h-[18px] w-16 rounded-full bg-gray-200"></div>
  </div>

  <!-- title (سطرين) -->
  <div class="flex flex-col gap-2 lg:pb-1">
    <div class="h-6 w-11/12 rounded bg-gray-200"></div>
    <div class="h-6 w-2/3 rounded bg-gray-200"></div>
  </div>

  <!-- teacher -->
  <div class="flex items-center gap-3 lg:pb-6">
    <div class="size-10 shrink-0 rounded-full bg-gray-200"></div>
    <div class="h-5 w-36 rounded bg-gray-200"></div>
  </div>

  <!-- start date + duration -->
  <div class="grid grid-cols-2 gap-4 lg:grid-cols-1 lg:gap-3 lg:pb-8">
    <div class="flex flex-col gap-1">
      <div class="h-4 w-16 rounded bg-gray-200 lg:hidden"></div>
      <div class="flex items-center gap-3">
        <div class="h-4.25 w-3.75 shrink-0 rounded bg-gray-200"></div>
        <div class="h-5 w-28 rounded bg-gray-200"></div>
      </div>
    </div>
    <div class="flex flex-col gap-1">
      <div class="h-4 w-14 rounded bg-gray-200 lg:hidden"></div>
      <div class="flex items-center gap-3">
        <div class="h-3.5 w-4.25 shrink-0 rounded bg-gray-200"></div>
        <div class="h-5 w-20 rounded bg-gray-200"></div>
      </div>
    </div>
  </div>

  <!-- button -->
  <div class="h-11 w-full rounded-lg bg-gray-200"></div>
</div>
