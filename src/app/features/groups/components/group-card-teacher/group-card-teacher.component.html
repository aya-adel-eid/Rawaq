<article
  class="flex h-full min-h-[373px] flex-col rounded-[12px] border border-[#BEC8CA4D] bg-white p-6 shadow-[0_4px_16px_0_rgba(0,0,0,0.06)]"
>
  <!-- title + description -->
  <div class="flex flex-col gap-2">
    <h2 class="line-clamp-1 text-[1.5rem] leading-8 font-semibold tracking-normal text-[#111C2C]">
      {{ group()?.name }}
    </h2>
    <p class="line-clamp-2 text-[1rem] leading-6 tracking-normal text-[#3E494A]">
      {{ group()?.description }}
    </p>
  </div>

  <!-- stats -->
  <div class="grid grid-cols-3 gap-2 pt-6">
    <div
      class="flex flex-col items-center gap-1 rounded-[8px] border border-[#BEC8CA1A] bg-[#F0F3FF] py-3"
    >
      <span class="text-primary text-[1.25rem] leading-7 font-bold tracking-[0.5px]">{{
        group()?.members_count
      }}</span>
      <span class="text-2xs leading-3.5 tracking-[0.5px] text-[#3E494A] uppercase">Members</span>
    </div>

    <div
      class="flex flex-col items-center gap-1 rounded-[8px] border border-[#BEC8CA1A] bg-[#F0F3FF] py-3"
    >
      <span class="text-primary text-[1.25rem] leading-7 font-bold tracking-[0.5px]">{{
        group()?.assignments_count
      }}</span>
      <span class="text-2xs leading-3.5 tracking-[0.5px] text-[#3E494A] uppercase">Tasks</span>
    </div>

    <div
      class="flex flex-col items-center gap-1 rounded-[8px] border border-[#BEC8CA1A] bg-[#F0F3FF] py-3"
    >
      <span class="text-primary text-[1.25rem] leading-7 font-bold tracking-[0.5px]">{{
        group()?.posts_count
      }}</span>
      <span class="text-2xs leading-3.5 tracking-[0.5px] text-[#3E494A] uppercase">Posts</span>
    </div>
  </div>

  <!-- footer -->
  <div class="mt-auto flex flex-col gap-4 pt-6">
    <div class="flex items-center justify-between gap-2">
      <span class="text-[0.75rem] leading-4 tracking-normal text-[#6F797A]">
        Created {{ group()?.created_at | date: 'MMM d, y' }}
      </span>

      <!-- Archived badge: اعرضه بس لو الجروب archived -->
      @if (group()?.is_archived) {
        <span
          class="rounded-full bg-[#FFDAD6] px-2 py-0.5 text-[0.625rem] leading-4 font-bold tracking-[0.5px] text-[#BA1A1A] uppercase"
        >
          Archived
        </span>
      }
    </div>

    <button
      type="button"
      class="bg-primary w-full cursor-pointer rounded-[8px] py-2.5 text-center text-[0.875rem] leading-5 font-medium tracking-[0.14px] text-white shadow-sm"
    >
      Open Group
    </button>
  </div>
</article>
