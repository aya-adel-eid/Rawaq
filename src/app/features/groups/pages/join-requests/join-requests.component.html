<section class="flex flex-col gap-8 px-10">
  <!-- header -->
  <div>
    <h2
      class="text-[2rem] leading-10 tracking-[-0.32px] font-semibold text-[#111C2C] flex items-center gap-3"
    >
      Join Requests
      <span
        class="bg-[#7A5E0A] w-10.5 h-6.5 py-0.5 px-3 rounded-full text-[0.875rem] tracking-[0.14px] leading-5 text-[#FFDA83]"
        >12</span
      >
    </h2>
    <p class="text-[1rem] leading-6 tracking-normal text-[#3E494A] font-normal">
      Review and manage student requests to join your groups.
    </p>
  </div>
  <!-- for search -->
  <div
    class="bg-white border border-[#E7EEFF80]/50 backdrop-blur-sm shadow-sm p-6 rounded-[12px] flex justify-between"
  >
    <div class="w-full max-w-lg px-8 hidden lg:block">
      <div class="relative">
        <span
          class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-[#6B7280]"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M16.6 18L10.3 11.7C9.8 12.1 9.225 12.4167 8.575 12.65C7.925 12.8833 7.23333 13 6.5 13C4.68333 13 3.14583 12.3708 1.8875 11.1125C0.629167 9.85417 0 8.31667 0 6.5C0 4.68333 0.629167 3.14583 1.8875 1.8875C3.14583 0.629167 4.68333 0 6.5 0C8.31667 0 9.85417 0.629167 11.1125 1.8875C12.3708 3.14583 13 4.68333 13 6.5C13 7.23333 12.8833 7.925 12.65 8.575C12.4167 9.225 12.1 9.8 11.7 10.3L18 16.6L16.6 18ZM6.5 11C7.75 11 8.8125 10.5625 9.6875 9.6875C10.5625 8.8125 11 7.75 11 6.5C11 5.25 10.5625 4.1875 9.6875 3.3125C8.8125 2.4375 7.75 2 6.5 2C5.25 2 4.1875 2.4375 3.3125 3.3125C2.4375 4.1875 2 5.25 2 6.5C2 7.75 2.4375 8.8125 3.3125 9.6875C4.1875 10.5625 5.25 11 6.5 11Z"
              fill="#6F797A"
            />
          </svg>
        </span>

        <input
          type="text"
          placeholder="Search by student name or email"
          class="w-full h-12.25 pl-10 pr-4 rounded-[8px] bg-Surface border border-[#BEC8CA] text-[1rem] text-[#1F2937] placeholder:text-[#6B7280] leading-[100%] tracking-normal focus:outline-none focus:border-[#0F5257] focus:ring-2 focus:ring-[#0F5257]/20"
        />
      </div>
    </div>
    <div>
      <select
        id="countries"
        class="block w-full ps-4 pe-10 py-3 bg-Surface border border-[#BEC8CA] text-[#111C2C] text-[1rem] tracking-normal leading-6 rounded-[8px] focus:ring-0"
      >
        <option selected>All Groups</option>
        <option value="US">United States</option>
        <option value="CA">Canada</option>
        <option value="FR">France</option>
        <option value="DE">Germany</option>
      </select>
    </div>
  </div>
  <!--  -->
  <div>
    @if (hasError()) {
      <app-show-error
        [message]="`Unable to load join requests.
Please try again.`"
        (retry)="getAllGroupJoinReq()"
      ></app-show-error>
    } @else {
      @if (!allGroupJoinReq()) {
        <app-join-group-req-skeleton></app-join-group-req-skeleton>
      } @else {
        <app-join-requests-card [allGroupJoinReq]="allGroupJoinReq()!"></app-join-requests-card>
      }
    }
  </div>
</section>
