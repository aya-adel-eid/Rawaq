<section class="min-h-screen flex flex-col gap-6 mb-20 pb-10">
  <!-- header -->
  <div class="p-8 rounded-[12px] bg-[#006D77] flex gap-5">
    <!-- image -->

    <img src="/images/person.png" alt="" class="size-20 rounded-full border-4 border-Surface" />
    <div class="flex flex-col gap-1">
      <h3 class="text-[2rem] leading-10 tracking-[-0.32px] font-semibold text-white">
        Frontend Group 2
      </h3>
      <p class="text-[0.875rem] leading-5 tracking-[0.14px] text-[#FFFFFFE5]/90">
        <span class="font-medium">Instructor: </span><span class="font-bold">Mahmoud Taha</span>
      </p>
      <p class="text-[1rem] tracking-normal leading-6 text-white font-normal">
        Mastering modern web development with React and Tailwind CSS.
      </p>
    </div>
  </div>
  <div class="grid grid-cols-1 gap-6 md:grid-cols-3 py-8" role="tablist">
    @for (item of tabs; track item.id) {
      <button
        type="button"
        role="tab"
        class="flex cursor-pointer items-center gap-4 shadow-md rounded-[8px] border-l-4 bg-white p-5 text-left transition hover:shadow-md"
        [class]="item.border"
      >
        <!-- icon -->
        <span
          class="flex size-12 shrink-0 items-center justify-center rounded-[8px]"
          [class]="item.iconBg"
        >
          <span
            class="block size-5 bg-current"
            [style.mask]="'url(/icons/' + item.icon + '.svg) center / contain no-repeat'"
            [style.webkitMask]="'url(/icons/' + item.icon + '.svg) center / contain no-repeat'"
          ></span>
        </span>

        <!-- content -->
        <span class="flex flex-col">
          <span class="text-[1rem] leading-6 font-bold text-[#111C2C]">{{ item.title }}</span>
          <span class="text-[0.75rem] leading-4 text-[#3E494A] font-semibold">{{
            item.subtitle
          }}</span>
        </span>
      </button>
    }
  </div>
  <!--  -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
    <!-- posts -->
    <div class="lg:col-span-8 gap-6 relative">
      <!-- header -->
      <div class="flex justify-between items-center pb-4">
        <h3 class="text-[1.5rem] font-semibold leading-6 tracking-normal text-[#111C2C]">
          Latest Posts
        </h3>
        <a href="" class="text-[0.875rem] leading-5 tracking-[0.14px] text-primary font-bold"
          >View All Posts</a
        >
      </div>
      <app-post-card></app-post-card>
      <div class="absolute -bottom-20 inset-e-3">
        <button
          class="size-14 bg-primary rounded-full flex items-center justify-center shadow-[0_20px_25px_-5px_rgba(0,0,0,0.1),0_8px_10px_-6px_rgba(0,0,0,0.1)] cursor-pointer"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 17 17"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M7 9.33333H0V7H7V0H9.33333V7H16.3333V9.33333H9.33333V16.3333H7V9.33333V9.33333"
              fill="white"
            />
          </svg>
        </button>
      </div>
    </div>
    <!-- assignment -->
    <div class="lg:col-span-4 gap-6">
      <!-- header -->
      <div class="flex justify-between pb-4">
        <h3 class="text-[1rem] leading-6 tracking-normal text-[#111C2C] font-bold">Assignments</h3>
        <a href="" class="text-[1rem] leading-6 tracking-normal text-primary font-normal"
          >View All</a
        >
      </div>
      <div>
        <app-assignments-card></app-assignments-card>
        <!-- boot -->
        <div class="py-4">
          <button
            class="p-5 w-full border-b border-b-[#BEC8CA33]/20 bg-[#006D770D] flex gap-2 rounded-[8px] shadow items-center"
          >
            <span
              ><svg
                width="22"
                height="19"
                viewBox="0 0 22 19"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M3 13C2.16667 13 1.45833 12.7083 0.875 12.125C0.291667 11.5417 0 10.8333 0 10C0 9.16667 0.291667 8.45833 0.875 7.875C1.45833 7.29167 2.16667 7 3 7V5C3 4.45 3.19583 3.97917 3.5875 3.5875C3.97917 3.19583 4.45 3 5 3H8C8 2.16667 8.29167 1.45833 8.875 0.875C9.45833 0.291667 10.1667 0 11 0C11.8333 0 12.5417 0.291667 13.125 0.875C13.7083 1.45833 14 2.16667 14 3H17C17.55 3 18.0208 3.19583 18.4125 3.5875C18.8042 3.97917 19 4.45 19 5V7C19.8333 7 20.5417 7.29167 21.125 7.875C21.7083 8.45833 22 9.16667 22 10C22 10.8333 21.7083 11.5417 21.125 12.125C20.5417 12.7083 19.8333 13 19 13V17C19 17.55 18.8042 18.0208 18.4125 18.4125C18.0208 18.8042 17.55 19 17 19H5C4.45 19 3.97917 18.8042 3.5875 18.4125C3.19583 18.0208 3 17.55 3 17V13V13M8 11C8.41667 11 8.77083 10.8542 9.0625 10.5625C9.35417 10.2708 9.5 9.91667 9.5 9.5C9.5 9.08333 9.35417 8.72917 9.0625 8.4375C8.77083 8.14583 8.41667 8 8 8C7.58333 8 7.22917 8.14583 6.9375 8.4375C6.64583 8.72917 6.5 9.08333 6.5 9.5C6.5 9.91667 6.64583 10.2708 6.9375 10.5625C7.22917 10.8542 7.58333 11 8 11V11M14 11C14.4167 11 14.7708 10.8542 15.0625 10.5625C15.3542 10.2708 15.5 9.91667 15.5 9.5C15.5 9.08333 15.3542 8.72917 15.0625 8.4375C14.7708 8.14583 14.4167 8 14 8C13.5833 8 13.2292 8.14583 12.9375 8.4375C12.6458 8.72917 12.5 9.08333 12.5 9.5C12.5 9.91667 12.6458 10.2708 12.9375 10.5625C13.2292 10.8542 13.5833 11 14 11V11M7 15H15V13H7V15V15M5 17H17V17V17V5V5V5H5V5V5V17V17V17V17M11 11V11V11V11V11V11V11V11V11V11V11V11V11V11"
                  fill="#00535B"
                />
              </svg>
            </span>
            <span class="text-[1rem] font-bold leading-6 tracking-normal text-[#111C2C]">
              AI Learning Assistant
            </span>
          </button>
          <div class="py-4 w-full shadow bg-white rounded-b-[8px]">
            <!-- body -->
            <div>
              <div class="bg-white p-5 w-full">
                <!-- message -->
                <p
                  class="text-[0.875rem] max-w-[450px] py-3 ps-3 pe-[35.69px] bg-primary leading-5 tracking-[0.14px] font-medium text-white rounded-tl-[8px] rounded-b-[8px]"
                >
                  How do I use Tailwind's grid-cols-3 with responsive breakpoints?
                </p>
              </div>
            </div>
            <div class="border-t border-t-[#BEC8CA]/20 bg-white p-4">
              <div
                class="relative rounded-[8px] border border-[#BEC8CA]/60 bg-white focus-within:border-primary"
              >
                <textarea
                  rows="2"
                  placeholder="Ask anything about your group..."
                  aria-label="Message to AI assistant"
                  class="block w-full resize-none rounded-[8px] bg-transparent p-3 pe-12 pb-10 border border-[#BEC8CA80] text-[0.875rem] leading-5 tracking-[0.14px] text-[#111C2C] outline-none focus:border-primary focus:ring-0 placeholder:text-[#6F797A]"
                ></textarea>

                <button
                  type="button"
                  aria-label="Send message"
                  class="absolute right-2 bottom-2 flex size-8 cursor-pointer items-center justify-center rounded-full bg-[#E7EEFF] text-primary transition hover:bg-[#d6e2ff] disabled:cursor-not-allowed disabled:opacity-50"
                >
                  <svg
                    width="19"
                    height="16"
                    viewBox="0 0 19 16"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M0 16V0L19 8L0 16V16M2 13L13.85 8L2 3V6.5L8 8L2 9.5V13V13M2 13V8V3V6.5V6.5V9.5V9.5V13V13"
                      fill="#00535B"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<app-post-form></app-post-form>
