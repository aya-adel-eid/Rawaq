<section class="mx-auto flex w-full max-w-[1100px] flex-col gap-8">
  <!-- ===== Page header ===== -->
  <header class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between md:gap-8">
    <div class="flex max-w-[640px] flex-col gap-2">
      <h1
        class="text-[2rem] leading-10 tracking-[-0.32px] font-bold text-[#111C2C] md:text-[2rem] md:leading-10"
      >
        My Learning Groups
      </h1>
      <p class="text-[1rem] leading-6 text-[#3E494A]">
        Manage your learning groups and monitor their activity. Organize cohorts, track assignments,
        and foster student discussion in a structured academic environment.
      </p>
    </div>

    <button
      type="button"
      class="bg-primary flex h-10 w-full shrink-0 cursor-pointer items-center justify-center gap-2 rounded-[8px] py-3 px-4 text-[0.875rem] leading-5 tracking-[0.14px] font-medium text-white md:w-auto"
    >
      <svg
        width="11"
        height="11"
        viewBox="0 0 11 11"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M4.5 6H0V4.5H4.5V0H6V4.5H10.5V6H6V10.5H4.5V6V6" fill="white" />
      </svg>

      Create New Group
    </button>
  </header>

  <!-- ===== Toolbar ===== -->
  <div
    class="flex flex-col gap-3 rounded-[8px] border pt-6 px-4 pb-4 border-[#BEC8CA4D] bg-white p-3 shadow-[0_2px_8px_0_rgba(0,0,0,0.04)] sm:flex-row sm:items-center"
  >
    <label class="relative min-w-0 flex-1">
      <span class="sr-only">Search by group name</span>
      <svg
        class="absolute start-3 top-1/2 -translate-y-1/2"
        width="18"
        height="18"
        viewBox="0 0 18 18"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M16.6 18L10.3 11.7C9.8 12.1 9.225 12.4167 8.575 12.65C7.925 12.8833 7.23333 13 6.5 13C4.68333 13 3.14583 12.3708 1.8875 11.1125C0.629167 9.85417 0 8.31667 0 6.5C0 4.68333 0.629167 3.14583 1.8875 1.8875C3.14583 0.629167 4.68333 0 6.5 0C8.31667 0 9.85417 0.629167 11.1125 1.8875C12.3708 3.14583 13 4.68333 13 6.5C13 7.23333 12.8833 7.925 12.65 8.575C12.4167 9.225 12.1 9.8 11.7 10.3L18 16.6L16.6 18V18M6.5 11C7.75 11 8.8125 10.5625 9.6875 9.6875C10.5625 8.8125 11 7.75 11 6.5C11 5.25 10.5625 4.1875 9.6875 3.3125C8.8125 2.4375 7.75 2 6.5 2C5.25 2 4.1875 2.4375 3.3125 3.3125C2.4375 4.1875 2 5.25 2 6.5C2 7.75 2.4375 8.8125 3.3125 9.6875C4.1875 10.5625 5.25 11 6.5 11V11"
          fill="#6F797A"
        />
      </svg>

      <input
        type="text"
        placeholder="Search by group name..."
        class="focus:border-primary h-10 w-full rounded-[6px] border border-[#BEC8CA] bg-Surface ps-10 pe-3 text-[0.875rem] text-[#6B7280] outline-none placeholder:text-[#6F797A] focus:ring-0"
      />
    </label>

    <div class="flex items-center gap-3">
      <label
        for="sort"
        class="shrink-0 text-[0.875rem] leading-4 tracking-[0.14px] font-medium text-[#3E494A]"
      >
        Sort by:
      </label>
      <div class="relative min-w-0 flex-1 sm:w-35 sm:flex-none">
        <select
          id="sort"
          class="focus:border-primary h-10 w-full cursor-pointer appearance-none rounded-[6px] py-3 ps-4 border border-[#BEC8CA] bg-Surface pe-9 text-[0.875rem] leading-4 tracking-[0.14px] font-medium text-[#111C2C] outline-none"
        >
          <option>Newest</option>
          <option>Oldest</option>
          <option>Name (A-Z)</option>
        </select>
        <svg
          aria-hidden="true"
          class="pointer-events-none absolute end-3 top-1/2 -translate-y-1/2"
          width="10"
          height="6"
          viewBox="0 0 10 6"
          fill="none"
        >
          <path d="M1 1L5 5L9 1" stroke="#3E494A" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </div>

      <button
        type="button"
        aria-label="Filters"
        class="flex size-10 shrink-0 cursor-pointer items-center justify-center rounded-[6px] bg-Surface-container"
      >
        <svg
          width="18"
          height="12"
          viewBox="0 0 18 12"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M7 12V10H11V12H7V12M3 7V5H15V7H3V7M0 2V0H18V2H0V2" fill="#00535B" />
        </svg>
      </button>
    </div>
  </div>

  <!-- ===== Groups grid ===== -->
  <ul class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    <li>
      <app-group-card-teacher></app-group-card-teacher>
    </li>

    <!-- Add Group card -->
    <li>
      <button
        type="button"
        class="hover:border-primary hover:bg-primary/5 flex h-full min-h-[200px] w-full cursor-pointer flex-col items-center justify-center gap-3 rounded-[12px] border-2 border-dashed border-[#BEC8CA] bg-transparent p-6 text-center transition-colors sm:min-h-[373px]"
      >
        <span class="flex size-12 items-center justify-center rounded-full bg-[#E1E8F5]">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M7 9H0V7H7V0H9V7H16V9H9V16H7V9Z" fill="#3E494A" />
          </svg>
        </span>
        <span class="flex flex-col gap-1">
          <span class="text-[1.25rem] leading-7 font-semibold text-[#3E494A]">Add Group</span>
          <span class="text-[0.75rem] leading-4 text-[#6F797A]">
            Start a new learning journey<br class="hidden sm:block" />
            with a fresh cohort.
          </span>
        </span>
      </button>
    </li>
  </ul>
</section>
